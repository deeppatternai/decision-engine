- insert:
    - id: deeppattern-visual-harness
      name: '@deeppattern/de-visual-harness'

    - id: deeppattern-visual-harness-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: deeppattern-visual
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deeppattern/de-visual-harness/package.json')), 'skills')
